name: Temporary career checklist reconciliation

on:
  push:
    branches:
      - agent/csat-set-b-operator-validation-docs

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/csat-set-b-operator-validation-docs
          fetch-depth: 0

      - name: Update authoritative checklist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/status/career-copilot-checklist.md")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()

          status_note = (
              "Latest operator-status update: **2026-07-14 — UPSC CSE 2025 Prelims "
              "GS Paper-II CSAT Set-B full-paper production path PARTIAL PASS.** Exact paper "
              "readiness (80 verified questions / 80 active projections), real learner/admin "
              "identity, learner-owned frozen attempt, refresh persistence, submit/scoring/result/"
              "review, and anonymous/learner/super-admin projection-table RLS passed. Exact Set-B "
              "card identity, `UPSC` catalogue search, large-paper palette discoverability, MCQ "
              "clear-response, stale provenance metadata, and revision entry mode remain open. "
              "Evidence: `docs/audits/2026-07-14-upsc-cse-2025-csat-set-b-learner-access-validation.md`."
          )

          if status_note not in text:
              verification_idx = next(
                  i for i, line in enumerate(lines) if line.startswith("Last repo verification:")
              )
              lines[verification_idx + 1:verification_idx + 1] = ["", status_note]

          prefix = "| PR-5/6 learner PYQ practice (full paper / section / topic / revision) |"
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one PR-5/6 checklist row, found {len(matches)}")

          lines[matches[0]] = (
              "| PR-5/6 learner PYQ practice (full paper / section / topic / revision) | "
              "PARTIAL — EXACT UPSC CSE 2025 CSAT SET-B FULL-PAPER PRODUCTION FLOW + ACCESS "
              "CONTROL OPERATOR VALIDATED (2026-07-14); LEARNER IDENTITY/DISCOVERABILITY/"
              "CLEAR-RESPONSE DEFECTS OPEN; REVISION MODE DEFERRED TO PR-8 | "
              "Exact paper `505b29a0-0d4d-5230-88aa-3bbc525a6db5` (`GS-PAPER-II-CSAT`, "
              "metadata Set-B) passed: official UPSC PDF attached; 80 verified questions; "
              "80 active projections; `/pyq-summary` returned 80/80 practice-ready; learner-owned "
              "attempt `9269bf14-e919-4250-84c0-b9b464117eff` froze 80 template ids, 80 response "
              "rows and 80 unique canonical question ids; answers persisted after refresh; submit, "
              "result and review returned 200; totals reconciled `2 + 11 + 67 = 80`; printed option "
              "labels and dwell time persisted. Direct PostgREST RLS proof: anonymous `200 []`, "
              "learner `200 []`, super-admin `200` with a projection row. This launch was intentionally "
              "untimed (`time_remaining_sec=null`); render explicit `Untimed`, not a countdown. Open: "
              "safe `CSAT · Set-B` paper identity, acronym/alias search so `UPSC` finds `upsc-cse`, "
              "80+ palette visibility/active auto-scroll, MCQ `Clear response`, stale "
              "`provenance_pending=true` cleanup, and revision-mode entry. Full evidence: "
              "`docs/audits/2026-07-14-upsc-cse-2025-csat-set-b-learner-access-validation.md`. |"
          )

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Remove temporary workflow and push result
        shell: bash
        run: |
          git rm .github/workflows/temp-update-career-checklist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status/career-copilot-checklist.md
          git diff --cached --check
          git commit -m "docs: update career copilot checklist"
          git push origin HEAD:agent/csat-set-b-operator-validation-docs
