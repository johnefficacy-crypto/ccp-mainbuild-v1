name: E2E

# Critical-flow Playwright suite. The workflow reports a status on every PR, but
# only starts Chromium when changed files can affect the covered Study OS/mock
# journeys. Pushes to main always run the full suite.
#
# When selected, it brings up the real stack — local Supabase (via the CLI +
# Docker), the FastAPI backend, and a production build of the SPA — seeds
# deterministic fixtures, then runs the three flows.
#
# See docs/testing/e2e.md for the local equivalent and for debugging failures.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# A superseded PR-branch run (up to 40 min of Chromium) is cancelled when a
# newer commit lands; pushes to main are never cancelled.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Decide whether Chromium E2E is required
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "push") {
              core.setOutput("run_e2e", "true");
              core.notice("Running Chromium E2E for push to main.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const relevantPatterns = [
              /^\.github\/workflows\/e2e\.yml$/,
              /^app\/frontend\/(?:src|public|e2e|config)\//,
              /^app\/frontend\/package(?:-lock)?\.json$/,
              /^app\/backend\/server\.py$/,
              /^app\/backend\/requirements\.txt$/,
              /^app\/backend\/app\/api\/(?:auth|mock_engine|study_os)\.py$/,
              /^app\/backend\/app\/(?:auth(?:\/|\.py$)|common\/|core\/|db\/|study_os\/)/,
              /^app\/supabase\/migrations\//,
              /^app\/supabase\/seeds\/(?:e2e.*\.sql|apply_e2e_fixtures\.sh)$/,
              /^app\/supabase\/config\.toml$/,
            ];

            const matchingFiles = files
              .map(({ filename }) => filename)
              .filter((filename) => relevantPatterns.some((pattern) => pattern.test(filename)));

            const runE2E = matchingFiles.length > 0;
            core.setOutput("run_e2e", runE2E ? "true" : "false");

            if (runE2E) {
              core.notice(`Running Chromium E2E because these files are relevant: ${matchingFiles.join(", ")}`);
            } else {
              core.notice("Skipping Chromium E2E: this PR does not touch a covered runtime path.");
            }

      - name: E2E not required for this PR
        if: steps.changes.outputs.run_e2e != 'true'
        run: echo "Chromium Playwright suite skipped because no covered runtime path changed."

      - uses: actions/checkout@v4
        if: steps.changes.outputs.run_e2e == 'true'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run_e2e == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run_e2e == 'true'
        with:
          python-version: "3.12"

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.run_e2e == 'true'
        with:
          version: latest

      - name: Start Supabase (applies migrations)
        if: steps.changes.outputs.run_e2e == 'true'
        working-directory: app/supabase
        run: supabase start

      - name: Capture Supabase connection details
        if: steps.changes.outputs.run_e2e == 'true'
        working-directory: app/supabase
        run: |
          supabase status -o json > /tmp/sb.json
          echo "SB_API_URL=$(jq -r '.API_URL' /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "SB_DB_URL=$(jq -r '.DB_URL' /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "SB_ANON_KEY=$(jq -r '.ANON_KEY' /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "SB_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' /tmp/sb.json)" >> "$GITHUB_ENV"

      - name: Seed E2E fixtures
        if: steps.changes.outputs.run_e2e == 'true'
        # Apply via the guarded wrapper so the test-only seeds can never run
        # against a production Supabase host (mirrors the E2E_SUPABASE_URL guard).
        run: |
          ./app/supabase/seeds/apply_e2e_fixtures.sh "$SB_DB_URL" \
            app/supabase/seeds/e2e_fixtures.sql \
            app/supabase/seeds/e2e_workspace_fixtures.sql

      - name: Install system dependencies (Tesseract OCR)
        if: steps.changes.outputs.run_e2e == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng

      - name: Install backend deps
        if: steps.changes.outputs.run_e2e == 'true'
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend
        if: steps.changes.outputs.run_e2e == 'true'
        working-directory: app/backend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ env.SB_DB_URL }}
          ENABLE_SCHEDULER: "false"
          ADMIN_STUDY_OS_ENABLED: "true"
        run: |
          nohup uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          ready=
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::backend did not become healthy within 60s"
            cat /tmp/backend.log || true
            exit 1
          fi

      - name: Build frontend
        if: steps.changes.outputs.run_e2e == 'true'
        working-directory: app/frontend
        env:
          REACT_APP_SUPABASE_URL: ${{ env.SB_API_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ env.SB_ANON_KEY }}
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        if: steps.changes.outputs.run_e2e == 'true'
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E flows
        if: steps.changes.outputs.run_e2e == 'true'
        working-directory: app/frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_BACKEND_URL: http://127.0.0.1:8000
          E2E_SUPABASE_URL: ${{ env.SB_API_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ env.SB_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SERVICE_ROLE_KEY }}
        run: npm run e2e

      - name: Upload Playwright report
        if: always() && steps.changes.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/frontend/e2e/playwright-report
            app/frontend/e2e/test-results
          retention-days: 7

      - name: Backend log (on failure)
        if: failure() && steps.changes.outputs.run_e2e == 'true'
        run: cat /tmp/backend.log || true
