name: Safe-Write Lint

on:
  push:
    branches: [main]
  pull_request:

# One run per PR (pull_request) plus one post-merge run on main (push); no
# duplicate push run on PR branches. Cancel superseded PR runs only.
concurrency:
  group: safe-write-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safe-write-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint — _safe() wrapping write operations
        run: python scripts/lint_safe_writes.py app/backend
