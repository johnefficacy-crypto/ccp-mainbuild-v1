name: Supabase production deploy

# The production Supabase Auth configuration deployment pipeline.
# Structure: gate job runs first; deploy job has `needs: gate` so it cannot
# run — even if triggered — unless the gate exits 0. There is no alternate
# path that bypasses the gate.
#
# Pre-flight (operator must complete before triggering):
#   1. Remove [auth.sms.test_otp] from app/supabase/config.toml
#   2. Set [auth.email] enable_signup = false
#   3. Disable email provider in Supabase dashboard
#   4. Validate real SMS delivery end-to-end
#   5. Complete admin/user phone migration
#   See docs/status/Phone-OTP-Login-2026-06-26.md §"OPERATOR PENDING".
#
# Required repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
# Required environment variable: SUPABASE_OPERATOR_APPROVED=yes (set in the
# "production" GitHub environment to enforce the operator approval hard stop).

on:
  workflow_dispatch:

jobs:
  gate:
    name: Check config.toml is production-safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Supabase production config gate
        # Exits 1 if any violation is found:
        #   • [auth.sms.test_otp] present
        #   • no real SMS provider enabled (checked within its own section only)
        #   • [auth.email] enable_signup = true
        #   • SUPABASE_OPERATOR_APPROVED != "yes"
        env:
          SUPABASE_ENV: production
          SUPABASE_OPERATOR_APPROVED: ${{ secrets.SUPABASE_OPERATOR_APPROVED }}
        run: node scripts/check-supabase-prod-gate.mjs

  deploy:
    name: Push auth config to Supabase production
    runs-on: ubuntu-latest
    # REQUIRED dependency: gate must succeed before any hosted config mutation.
    # GitHub Actions enforces this; there is no way to skip it.
    needs: gate
    environment: production
    # All run: steps use app/supabase as their working directory so the config
    # the gate validated (app/supabase/config.toml) is the same one Supabase CLI
    # picks up — the two cannot diverge.
    defaults:
      run:
        working-directory: app/supabase
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply auth configuration to production Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase config push
