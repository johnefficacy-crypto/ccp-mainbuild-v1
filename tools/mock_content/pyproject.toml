[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-content"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8", "pandas>=2", "rapidfuzz>=3", "unidecode>=1.3"]

[project.scripts]
mock-content = "mock_content.cli:cli"

[tool.pytest.ini_options]
addopts = "--cov=mock_content --cov-report=term-missing --cov-fail-under=85"
